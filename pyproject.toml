[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-skill-number-facts"
dynamic = ["version"]
description = "Facts about numbers"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "JarbasAi", email = "jarbasai@mailfence.com"}
]
keywords = ["ovos", "skill", "plugin"]
dependencies = [
    "ovos-workshop>=8.0.0,<8.1.0",
    "ovos-date-parser>=0.0.1,<1.0.0",
    "ovos-number-parser>=0.0.1,<1.0.0"
]

[project.optional-dependencies]
test = [
    "ovoscope>=0.13.1,<1.0.0",
    "pytest>=7.0.0,<9",
    "pytest-timeout>=2.0.0",
    "padacioso>=1.0.2a3",
    "ovos-adapt-parser"
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-skill-number-facts"

[project.entry-points."ovos.plugin.skill"]
"ovos-skill-number-facts.openvoiceos" = "ovos_skill_number_facts:NumbersSkill"

[tool.setuptools.dynamic]
version = {attr = "ovos_skill_number_facts.version.__version__"}

[tool.setuptools]
packages = ["ovos_skill_number_facts"]

[tool.setuptools.package-dir]
ovos_skill_number_facts = "."

[tool.setuptools.package-data]
ovos_skill_number_facts = [
    "*.json",
    "locale/**/*",
]
